*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#08080A;color:#EDEEF0;font-family:'Noto Sans TC',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.gate{width:100%;max-width:380px;background:#15151B;border:2px solid #000;box-shadow:0 0 0 1px rgba(255,255,255,.12),6px 6px 0 rgba(0,0,0,.6);padding:28px 22px;text-align:center}

button{margin-top:14px;width:100%;font:900 16px 'Noto Sans TC',sans-serif;background:#EDEEF0;color:#0A0A0A;border:2px solid #000;box-shadow:4px 4px 0 rgba(0,0,0,.6);padding:12px;cursor:pointer}

button:disabled{opacity:.5;cursor:wait}
.err{min-height:20px;margin-top:12px;color:#FF6A60;font-size:13px;font-weight:700}
.note{margin-top:14px;font-size:11px;color:#6A6A70}

const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
 const enc=new TextEncoder();
 const base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(P.salt),iterations:P.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 for(const s of P.slots){
  try{
   const raw=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(s.iv)},k,ub(s.d)));
   const ck=await crypto.subtle.importKey('raw',raw.slice(0,32),'AES-GCM',false,['decrypt']);
   const html=new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(P.iv)},ck,ub(P.ct)));
   return {html, id:new TextDecoder().decode(raw.slice(32))};
  }catch(e){}
 }
 return null;
}
document.getElementById('gate').addEventListener('submit',async e=>{
 e.preventDefault();
 const pw=document.getElementById('pw').value.trim().toUpperCase();
 const err=document.getElementById('err'), go=document.getElementById('go');
 if(!pw){ err.textContent='請先輸入密碼'; return; }
 if(!window.crypto||!crypto.subtle){ err.textContent='這個瀏覽器不支援，請換 Chrome 或 Safari'; return; }
 go.disabled=true; go.textContent='解鎖中…'; err.textContent='';
 const r=await unlock(pw);
 if(!r){ go.disabled=false; go.textContent='開始龜劃'; err.textContent='密碼不對，再試一次'; return; }
 const html=r.html.replace('<head>','<head>\n<script>window.__TD_ID='+JSON.stringify(r.id)+';<\/script>');
 document.open(); document.write(html); document.close();
});
